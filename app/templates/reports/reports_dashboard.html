{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-4xl font-bold text-teal-400 mb-8">Reports Center</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <a href="{% url 'reports:expiry_report' %}" 
           class="bg-slate-800 hover:bg-slate-700 p-8 rounded-3xl border border-amber-500 transition-all">
            <h3 class="text-2xl font-semibold text-amber-400 mb-3">Expiry Report</h3>
            <p class="text-slate-400">View and export batches expiring soon</p>
        </a>

        <a href="{% url 'reports:stock_expiry_report' %}" 
           class="bg-slate-800 hover:bg-slate-700 p-8 rounded-3xl border border-emerald-500 transition-all">
            <h3 class="text-2xl font-semibold text-emerald-400 mb-3">Stock vs Expiry Report</h3>
            <p class="text-slate-400">Compare current stock with upcoming expiries</p>
        </a>
    </div>
</div>
{% endblock %}
