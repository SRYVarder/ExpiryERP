{% extends 'base.html' %}

{% block title %}Delete Product · REGON ExpiryERP{% endblock %}

{% block content %}
<div class="glass-card erp-confirm-card">
    <p class="erp-eyebrow">Master catalog</p>
    <h2 class="erp-title" style="font-size: 1.5rem;">Delete Product?</h2>
    <p class="erp-subtitle" style="margin-top: 0.75rem;">
        Are you sure you want to delete
        <strong class="cell-strong">{{ product.name }} ({{ product.icode }})</strong>?
    </p>
    <p class="erp-error" style="margin-top: 0.65rem;">This action cannot be undone.</p>

    <form method="post" class="erp-actions" style="justify-content: center; margin-top: 1.5rem;">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Yes, Delete</button>
        <a href="{% url 'inventory:product_list' %}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
