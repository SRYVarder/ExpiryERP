{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto p-6 text-center">
    <h2 class="text-2xl text-red-400 mb-6">Delete Product?</h2>
    <p class="mb-8">Are you sure you want to delete <strong>{{ product.name }} ({{ product.icode }})</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-500 px-8 py-4 rounded-2xl">
            Yes, Delete
        </button>
        <a href="{% url 'inventory:product_list' %}" 
           class="ml-4 text-slate-400 hover:text-white">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
