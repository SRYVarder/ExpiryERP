{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-teal-400 mb-8">{{ title }}</h1>
    
    <form method="post" class="bg-slate-800 p-8 rounded-3xl">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-8 flex gap-4">
            <button type="submit" 
                    class="bg-teal-600 hover:bg-teal-500 px-8 py-4 rounded-2xl font-semibold">
                Save Product
            </button>
            <a href="{% url 'inventory:product_list' %}" 
               class="bg-slate-700 hover:bg-slate-600 px-8 py-4 rounded-2xl">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
